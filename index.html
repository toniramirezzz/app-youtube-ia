/* =========================================================
   Identidad visual
   Fondo #FF8C42 · Contenedores #423E37 · Texto #FFFFFF
   Texto directamente sobre el fondo naranja → #423E37 (contraste)
   ========================================================= */
body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background: #FF8C42; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(66, 62, 55, .55); border-radius: 9999px; }
.card ::-webkit-scrollbar-thumb, aside ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .25); }

/* Safe areas iPhone */
.safe-pt { padding-top: env(safe-area-inset-top, 0px); }
.safe-pb { padding-bottom: max(env(safe-area-inset-bottom, 0px), 0px); }

/* Contenedores */
.card { background: #423E37; color: #fff; border: 1px solid rgba(255, 255, 255, .08); border-radius: 1rem; }
.card-inner { background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); border-radius: .75rem; }
.muted { color: rgba(255, 255, 255, .72); }
.subtle { color: rgba(255, 255, 255, .55); }
.pos { color: #86EFAC; }
.neg { color: #FDA4AF; }

/* Formularios (sobre #423E37) */
.input {
  width: 100%; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .2);
  border-radius: .75rem; padding: .6rem .85rem; color: #fff; font-size: .875rem; outline: none; transition: .15s;
}
.input:hover { border-color: rgba(255, 255, 255, .35); }
.input:focus { border-color: #FF8C42; box-shadow: 0 0 0 3px rgba(255, 140, 66, .28); }
.input::placeholder { color: rgba(255, 255, 255, .45); }
select.input option, select.input optgroup { background: #423E37; color: #fff; }
textarea.input { resize: vertical; min-height: 5rem; }
input[type="date"].input, input[type="time"].input { color-scheme: dark; }
input[type="checkbox"], input[type="radio"] { accent-color: #FF8C42; width: 1rem; height: 1rem; }
.label { display: block; font-size: .75rem; font-weight: 600; color: rgba(255, 255, 255, .88); margin-bottom: .35rem; }
.req::after { content: ' *'; color: #FF8C42; }
.file-input::file-selector-button {
  margin-right: .75rem; padding: .45rem .8rem; border: 0; border-radius: .6rem; background: #FF8C42; color: #423E37; font-weight: 700; cursor: pointer;
}

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: .75rem; padding: .6rem 1rem; font-size: .8rem; font-weight: 700; cursor: pointer; transition: .15s; white-space: nowrap; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: #FF8C42; color: #423E37; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn-dark { background: #423E37; color: #fff; box-shadow: 0 6px 18px -8px rgba(66, 62, 55, .7); }
.btn-dark:hover:not(:disabled) { background: #514c43; }
.btn-ghost { background: rgba(255, 255, 255, .07); color: #fff; border: 1px solid rgba(255, 255, 255, .16); }
.btn-ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .14); }
.btn-danger { background: rgba(251, 113, 133, .14); color: #FECDD3; border: 1px solid rgba(251, 113, 133, .35); cursor: pointer; }
.btn-danger:hover { background: rgba(251, 113, 133, .24); }

  function openModal(html, { wide = false } = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/55 backdrop-blur-sm';

  // ===================================================================

  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = (buf) => { let s = ''; new Uint8Array(buf).forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); };

  const VAULT_ITERATIONS = 600000, VERIFIER_TEXT = 'creator-hub-vault-ok';

    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);

  }
  function parseTotp(input) {
    const s = String(input ?? '').trim();
    if (!s) return null;
    if (s.startsWith('otpauth://')) {
      try { const u = new URL(s); const secret = (u.searchParams.get('secret') || '').replace(/\s/g, '').toUpperCase();
        return secret ? { secret, digits: Number(u.searchParams.get('digits')) || 6, period: Number(u.searchParams.get('period')) || 30 } : null; } catch { return null; }
    }
    const clean = s.replace(/[\s-]/g, '').toUpperCase();
    return /^[A-Z2-7]{16,}=*$/.test(clean) ? { secret: clean.replace(/=+$/, ''), digits: 6, period: 30 } : null;
  }
  function base32ToBytes(s) {
    const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; let bits = 0, value = 0; const out = [];
    for (const ch of s) { const i = a.indexOf(ch); if (i < 0) continue; value = (value << 5) | i; bits += 5; if (bits >= 8) { out.push((value >>> (bits - 8)) & 255); bits -= 8; } }
    return new Uint8Array(out);

    const key = await crypto.subtle.importKey('raw', base32ToBytes(secret), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);

    return String(bin % 10 ** digits).padStart(digits, '0');
  }

  function generatePassword(len = 20) {

  // ===================================================================
  // 8. YOUTUBE (gratis): Google Identity Services en el navegador
  //    Sin servidor no hay "refresh token": Google pide confirmar la cuenta
  //    al sincronizar o subir (token válido 1 hora).
  // ===================================================================
  const YT_SCOPES = [
    'https://www.googleapis.com/auth/youtube.readonly',
    'https://www.googleapis.com/auth/youtube.upload',
    'https://www.googleapis.com/auth/yt-analytics.readonly',
    'https://www.googleapis.com/auth/yt-analytics-monetary.readonly',
  ].join(' ');
  const ytTokens = new Map(); // youtube_channel_id → { token, exp }

  function googleToken() {
    return new Promise((resolve, reject) => {
      if (!GOOGLE_CLIENT_ID) return reject(new Error('Para conectar YouTube rellena GOOGLE_CLIENT_ID en la configuración (gratis, ver instrucciones).'));
      if (!window.google?.accounts?.oauth2) return reject(new Error('No se ha podido cargar el acceso de Google. Recarga la página.'));
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: YT_SCOPES, prompt: 'select_account',
        callback: (r) => (r.error ? reject(new Error(r.error_description || r.error)) : resolve(r)),
        error_callback: (e) => reject(new Error(e?.type === 'popup_closed' ? 'Ventana de Google cerrada' : (e?.message || 'Error de Google'))),
      });
      client.requestAccessToken();
    });
  }
  async function gget(url, token) {
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(j.error?.message || `Error ${res.status} en la API de Google`); e.status = res.status; throw e; }
    return j;
  }
  /** Token para un canal concreto: hay que elegir la cuenta de Google de ese canal */
  async function tokenForChannel(ch) {
    const c = ytTokens.get(ch.youtube_channel_id);
    if (c && c.exp > Date.now() + 60e3) return c.token;
    const r = await googleToken();
    const mine = await gget('https://www.googleapis.com/youtube/v3/channels?part=id&mine=true', r.access_token);
    const id = mine.items?.[0]?.id;
    if (id) ytTokens.set(id, { token: r.access_token, exp: Date.now() + r.expires_in * 1000 });
    if (id !== ch.youtube_channel_id) throw new Error(`Has elegido otra cuenta. Elige la cuenta de Google de "${ch.title}".`);
    return r.access_token;
  }
  const isoDurationSeconds = (d) => { const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d ?? ''); return m ? (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0) : 0; };
  const ymd = (d) => d.toISOString().slice(0, 10);

  async function connectChannel(btn) {
    await withBusy(btn, 'Conectando…', async () => {
      const r = await googleToken();
      const info = await gget('https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&mine=true', r.access_token);
      const c = info.items?.[0];
      if (!c) throw new Error('Esa cuenta de Google no tiene canal de YouTube');
      ytTokens.set(c.id, { token: r.access_token, exp: Date.now() + r.expires_in * 1000 });
      const ch = must(await sb.from('channels').upsert({
        youtube_channel_id: c.id, title: c.snippet.title, thumbnail_url: c.snippet.thumbnails?.default?.url ?? null,
        connected_by: S.profile.id, status: 'ok', status_detail: null,
      }, { onConflict: 'youtube_channel_id' }).select().single());
      toast('Canal conectado. Importando estadísticas…');
      await syncChannel(ch, r.access_token);
      await refreshChannels();
      selectChannel(ch.id);
      toast('Canal conectado y sincronizado');
      if (S.tab === 'canales') renderView(); else location.hash = 'canales';
    });
  }

  /** Descarga de YouTube Analytics: vistas Shorts / largos / directos e ingresos */
  async function syncChannel(ch, token) {
    const info = await gget(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&id=${ch.youtube_channel_id}`, token);
    const c = info.items?.[0];
    if (!c) throw new Error('Canal no encontrado en YouTube');
    const uploads = c.contentDetails?.relatedPlaylists?.uploads;
    const created = new Date(c.snippet.publishedAt), limit = new Date(Date.now() - 3 * 365 * 864e5);
    const start = ch.last_sync_at ? ymd(new Date(Date.now() - 35 * 864e5)) : ymd(created > limit ? created : limit);
    const base = `https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==MINE&startDate=${start}&endDate=${ymd(new Date())}`;
    const rows = new Map();
    const row = (day) => { if (!rows.has(day)) rows.set(day, { channel_id: ch.id, day, shorts_views: 0, long_views: 0, live_views: 0, revenue: 0, subscribers_gained: 0, subscribers_lost: 0 }); return rows.get(day); };

    const views = await gget(`${base}&metrics=views&dimensions=day,creatorContentType&sort=day`, token);
    for (const [day, type, v] of views.rows ?? []) {
      const r = row(day);
      if (type === 'SHORTS') r.shorts_views += v; else if (type === 'LIVE_STREAM') r.live_views += v; else r.long_views += v;
    }
    let monetized = true;
    try {
      const rev = await gget(`${base}&metrics=estimatedRevenue,subscribersGained,subscribersLost&dimensions=day&currency=EUR&sort=day`, token);
      for (const [day, revenue, g, l] of rev.rows ?? []) { const r = row(day); r.revenue = Math.round(revenue * 100) / 100; r.subscribers_gained = g; r.subscribers_lost = l; }
    } catch (e) {
      if (e.status !== 403) throw e;
      monetized = false;
      const subs = await gget(`${base}&metrics=subscribersGained,subscribersLost&dimensions=day&sort=day`, token);
      for (const [day, g, l] of subs.rows ?? []) { const r = row(day); r.subscribers_gained = g; r.subscribers_lost = l; }
    }
    const list = [...rows.values()];
    for (let i = 0; i < list.length; i += 500) must(await sb.from('channel_daily_stats').upsert(list.slice(i, i + 500), { onConflict: 'channel_id,day' }));

    must(await sb.from('channels').update({
      title: c.snippet.title, thumbnail_url: c.snippet.thumbnails?.default?.url ?? null,
      subscribers: Number(c.statistics.subscriberCount) || 0, total_views: Number(c.statistics.viewCount) || 0,
      video_count: Number(c.statistics.videoCount) || 0, uploads_playlist: uploads, monetized,
      status: 'ok', status_detail: null, last_sync_at: new Date().toISOString(),
    }).eq('id', ch.id));

    // Vídeos programados en YouTube Studio
    if (!uploads) return;
    const pl = await gget(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId=${uploads}`, token);
    const ids = (pl.items ?? []).map((i) => i.contentDetails.videoId);
    if (!ids.length) return;
    const vids = await gget(`https://www.googleapis.com/youtube/v3/videos?part=snippet,status,contentDetails&id=${ids.join(',')}`, token);
    const existing = must(await sb.from('scheduled_videos').select('id,youtube_video_id,status').eq('channel_id', ch.id).not('youtube_video_id', 'is', null)) ?? [];
    const known = new Map(existing.map((r) => [r.youtube_video_id, r]));
    for (const v of vids.items ?? []) {
      const publishAt = v.status?.publishAt, k = known.get(v.id);
      const scheduled = v.status?.privacyStatus === 'private' && publishAt && new Date(publishAt).getTime() > Date.now();
      if (scheduled) {
        if (k) await sb.from('scheduled_videos').update({ title: v.snippet.title, publish_at: publishAt, status: 'programado' }).eq('id', k.id);
        else await sb.from('scheduled_videos').insert({ channel_id: ch.id, youtube_video_id: v.id, title: v.snippet.title, description: v.snippet.description, tags: v.snippet.tags ?? [], kind: isoDurationSeconds(v.contentDetails?.duration) <= 180 ? 'short' : 'long', publish_at: publishAt, status: 'programado', source: 'youtube' });
      } else if (k && k.status === 'programado' && v.status?.privacyStatus === 'public') {
        await sb.from('scheduled_videos').update({ status: 'publicado' }).eq('id', k.id);
      }
    }
  }

  // ===================================================================
  // 9. REVISIÓN DE NICHO CON GEMINI (gratis, desde el navegador)
  // ===================================================================
  const AI = {
    key: () => LS.get('hub.gemini_key', ''),
    model: () => LS.get('hub.gemini_model', 'gemini-2.5-flash'),
    ytKey: () => LS.get('hub.yt_api_key', ''),
  };
  const median = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const round2 = (n) => Math.round(n * 100) / 100;

  async function ytPublic(path, params) {
    const key = AI.ytKey();
    if (!key) throw new Error('sin clave de YouTube');
    const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
    Object.entries({ ...params, key }).forEach(([k, v]) => u.searchParams.set(k, v));
    const res = await fetch(u); const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error?.message || 'Error en YouTube Data API');
    return j;
  }
  async function publicProfile(channelId) {
    const ch = await ytPublic('channels', { part: 'snippet,statistics,contentDetails', id: channelId });
    const c = ch.items?.[0];
    if (!c) return null;
    let recent = [];
    const uploads = c.contentDetails?.relatedPlaylists?.uploads;
    if (uploads) {
      const pl = await ytPublic('playlistItems', { part: 'contentDetails', playlistId: uploads, maxResults: '20' });
      const ids = (pl.items ?? []).map((i) => i.contentDetails.videoId);
      if (ids.length) {
        const v = await ytPublic('videos', { part: 'snippet,statistics,contentDetails', id: ids.join(',') });
        recent = (v.items ?? []).map((x) => ({ title: x.snippet.title, published: x.snippet.publishedAt, views: +x.statistics.viewCount || 0, likes: +x.statistics.likeCount || 0, comments: +x.statistics.commentCount || 0, seconds: isoDurationSeconds(x.contentDetails.duration) }));
      }
    }
    const n = recent.length;
    const dates = recent.map((r) => new Date(r.published).getTime()).sort((a, b) => a - b);
    const weeks = n > 1 ? Math.max((dates[n - 1] - dates[0]) / (7 * 864e5), 1 / 7) : 0;
    return {
      id: c.id, title: c.snippet.title, subscribers: +c.statistics.subscriberCount || 0, total_views: +c.statistics.viewCount || 0,
      avg_views_recent: n ? Math.round(recent.reduce((s, r) => s + r.views, 0) / n) : 0,
      uploads_per_week: n > 1 ? round2((n - 1) / weeks) : 0,
      shorts_share: n ? round2(recent.filter((r) => r.seconds <= 180).length / n) : 0,
      engagement: n ? round2(recent.reduce((s, r) => s + (r.views ? (r.likes + r.comments) / r.views : 0), 0) / n * 100) : 0,
      top_titles: [...recent].sort((a, b) => b.views - a.views).slice(0, 3).map((r) => `${r.title} (${r.views.toLocaleString('es-ES')} vistas)`),
    };
  }
  async function askGemini(prompt) {
    const key = AI.key();
    if (!key) throw new Error('Pega tu API Key gratuita de Google AI Studio en “Configuración de la IA”.');
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(AI.model())}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0.4 } }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error?.message || 'Error de Gemini');
    const text = (j.candidates?.[0]?.content?.parts ?? []).map((p) => p.text).join('') || '{}';
    return JSON.parse(text.replace(/^```json\s*|```$/g, ''));
  }

  async function runNicheReview(source = 'manual') {
    const d = (n) => ymd(new Date(Date.now() - n * 864e5));
    const [channels, competitors, stats] = await Promise.all([
      sb.from('channels').select('*').then(must),
      sb.from('competitors').select('*').then(must),
      sb.from('channel_daily_stats').select('*').gte('day', d(90)).limit(5000).then(must),
    ]);
    if (!channels?.length) throw new Error('Conecta al menos un canal antes de analizar el nicho');
    const warnings = [];
    if (!AI.ytKey()) warnings.push('Sin clave de YouTube Data API: no se han leído los datos públicos de la competencia.');

    const own = [];
    for (const ch of channels) {
      const s = (stats ?? []).filter((r) => r.channel_id === ch.id);
      const sum = (rows, k) => rows.reduce((a, r) => a + Number(r[k] || 0), 0);
      const v = (rows) => sum(rows, 'shorts_views') + sum(rows, 'long_views') + sum(rows, 'live_views');
      const last28 = s.filter((r) => r.day > d(28)), prev28 = s.filter((r) => r.day > d(56) && r.day <= d(28));
      const views90 = v(s), revenue90 = sum(s, 'revenue');
      own.push({
        title: ch.title, subscribers: ch.subscribers, monetized: ch.monetized, niche: ch.niche,
        views_28d: v(last28), views_prev_28d: v(prev28), shorts_views_28d: sum(last28, 'shorts_views'),
        long_views_28d: sum(last28, 'long_views') + sum(last28, 'live_views'), revenue_28d: round2(sum(last28, 'revenue')),
        rpm: views90 > 0 ? round2(revenue90 / (views90 / 1000)) : 0,
        public: AI.ytKey() ? await publicProfile(ch.youtube_channel_id).catch(() => null) : null,
      });
    }
    const comps = [];
    if (AI.ytKey()) for (const c of competitors ?? []) { const p = await publicProfile(c.youtube_channel_id).catch(() => null); if (p) comps.push({ ...p, niche: c.niche }); }
    const compMedian = median(comps.map((c) => c.avg_views_recent));

    // Proyecciones calculadas con vuestros datos reales (no las inventa la IA)
    const labels = Array.from({ length: 6 }, (_, i) => { const m = new Date(); m.setMonth(m.getMonth() + i + 1, 1); return m.toLocaleDateString('es-ES', { month: 'short', year: '2-digit' }); });
    const names = ['Conservador', 'Base', 'Optimista'];
    const totals = { Conservador: Array(6).fill(0), Base: Array(6).fill(0), Optimista: Array(6).fill(0) };
    let current = 0, potential = 0;
    for (const o of own) {
      const monthly = o.views_28d * 30 / 28;
      const g = o.views_prev_28d > 0 ? (o.views_28d - o.views_prev_28d) / o.views_prev_28d : 0;
      const base = clamp(g, -0.3, 0.3);
      const rates = { Conservador: base > 0 ? base * 0.5 : clamp(base - 0.05, -0.5, 0), Base: base, Optimista: base + 0.1 };
      for (const n of names) for (let m = 0; m < 6; m++) totals[n][m] += monthly * Math.pow(1 + rates[n], m + 1) / 1000 * o.rpm;
      current += monthly / 1000 * o.rpm;
      if (compMedian > 0 && o.rpm > 0) potential += (o.public?.uploads_per_week ?? 0) * 4.33 * compMedian / 1000 * o.rpm;
    }
    const projections = {
      labels, scenarios: names.map((n) => ({ name: n, revenue: totals[n].map(round2) })),
      current_monthly_revenue: round2(current), potential_monthly_revenue: round2(potential),
      assumptions: 'Ingresos = vistas mensuales × RPM real de los últimos 90 días. Base = tendencia de las últimas 4 semanas frente a las 4 anteriores (limitada a ±30 %/mes). Conservador = la mitad del crecimiento; Optimista = +10 puntos. Potencial = vuestro ritmo de subida × mediana de vistas por vídeo de la competencia × vuestro RPM.',
    };

    let ai = null, aiError = null;
    try {
      ai = await askGemini(`Eres un consultor experto en crecimiento de canales de YouTube (incluidos canales faceless/automatizados).
Analiza estos datos REALES y devuelve SOLO un JSON con esta forma:
{"resumen":"3-4 frases","mejoras":[{"canal":"nombre o 'Todos'","prioridad":"alta|media|baja","area":"Títulos|Miniaturas|Frecuencia|Shorts|Retención|Monetización|Temática|Otro","accion":"acción concreta y medible","motivo":"por qué, citando los datos"}],"competencia":["observación concreta sobre qué hace mejor la competencia"]}
Da entre 5 y 10 mejoras ordenadas por impacto. No inventes cifras que no estén en los datos. Responde en español.
NUESTROS CANALES: ${JSON.stringify(own)}
COMPETENCIA: ${JSON.stringify(comps)}
PROYECCIONES CALCULADAS: ${JSON.stringify(projections)}`);
    } catch (e) { aiError = e.message; }

    // Evita duplicados si dos socios lanzan la revisión automática a la vez
    if (source === 'cron') {
      const dup = must(await sb.from('ai_reports').select('id').eq('source', 'cron').gte('created_at', lastSunday20().toISOString()).limit(1));
      if (dup?.length) return null;
    }
    const report = must(await sb.from('ai_reports').insert({
      source, created_by: S.profile.id, period_start: d(28), period_end: ymd(new Date()),
      summary: ai?.resumen ?? (aiError ? `No se pudo generar el análisis de IA (${aiError}). Las métricas y proyecciones sí están calculadas.` : null),
      data: { own, competitors: comps, projections, improvements: ai?.mejoras ?? [], observations: ai?.competencia ?? [], ai_error: aiError, warnings },
    }).select().single());
    await logNotification({ kind: 'ia', title: 'Nueva revisión del nicho', body: source === 'cron' ? 'Revisión semanal automática lista.' : `Generada por ${S.profile.name}.` });
    return report;
  }

  /** Último domingo a las 20:00 en hora de Madrid (con cambio de hora) */
  function madridOffsetMs(d) {
    return new Date(d.toLocaleString('en-US', { timeZone: 'Europe/Madrid' })).getTime() - new Date(d.toLocaleString('en-US', { timeZone: 'UTC' })).getTime();
  }
  function lastSunday20() {
    const now = new Date();
    const wall = new Date(now.getTime() + madridOffsetMs(now));            // "reloj de Madrid" en UTC
    let back = wall.getUTCDay();
    if (back === 0 && wall.getUTCHours() < 20) back = 7;
    const t = Date.UTC(wall.getUTCFullYear(), wall.getUTCMonth(), wall.getUTCDate() - back, 20, 0, 0);
    return new Date(t - madridOffsetMs(new Date(t)));
  }
  function nextSunday20() { return new Date(lastSunday20().getTime() + 7 * 864e5); }

  async function autoNicheReview() {
    if (!S.profile || !AI.key() || !S.channels.length) return;
    const since = lastSunday20();
    const done = must(await sb.from('ai_reports').select('id').gte('created_at', since.toISOString()).limit(1));
    if (done?.length) return;
    toast('🤖 Ejecutando la revisión semanal pendiente del domingo…');
    try {
      const r = await runNicheReview('cron');
      if (r) { toast('Revisión semanal del nicho lista'); if (S.tab === 'nicho') renderView(); }
    } catch (e) { console.error(e); toast('Revisión automática: ' + e.message, 'error'); }
  }

          method: 'POST',

  // --- Lector del CSV de Revolut (personal y Business, en inglés o español) ---
  function parseCsv(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = first.split(';').length > first.split(',').length ? ';' : ',';
    const rows = []; let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((x) => x.trim() !== ''));
  }
  function parseAmount(s) {
    let v = String(s ?? '').trim().replace(/\s/g, '').replace('−', '-').replace(/[€$£]/g, '');
    if (!v) return NaN;
    if (v.includes(',') && v.includes('.')) v = v.lastIndexOf(',') > v.lastIndexOf('.') ? v.replace(/\./g, '').replace(',', '.') : v.replace(/,/g, '');
    else if (v.includes(',')) v = v.replace(',', '.');
    return parseFloat(v);
  }
  function parseCsvDate(s) {
    s = String(s ?? '').trim();
    let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})/.exec(s); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    const d = new Date(s); return isNaN(d) ? null : localDay(d);
  }
  function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(16); }

  function readRevolutCsv(text) {
    const rows = parseCsv(text);
    if (rows.length < 2) throw new Error('El archivo está vacío o no es un CSV');
    const H = rows[0].map((h) => h.trim().toLowerCase());
    const col = (...names) => { for (const n of names) { const i = H.findIndex((h) => h === n); if (i >= 0) return i; } for (const n of names) { const i = H.findIndex((h) => h.includes(n)); if (i >= 0) return i; } return -1; };
    const c = {
      date: col('completed date', 'date completed (utc)', 'date completed', 'fecha de finalización', 'fecha de finalizacion', 'fecha', 'date'),
      date2: col('started date', 'date started (utc)', 'date started', 'fecha de inicio'),
      desc: col('description', 'descripción', 'descripcion'),
      amount: col('total amount', 'importe total', 'amount', 'importe', 'cantidad'),
      fee: col('fee', 'comisión', 'comision'),
      currency: col('payment currency', 'currency', 'divisa', 'moneda'),
      state: col('state', 'estado'),
      type: col('type', 'tipo'),
      id: H.indexOf('id'),
      ref: col('reference', 'referencia'),
      balance: col('balance', 'saldo'),
    };
    if ((c.date < 0 && c.date2 < 0) || c.amount < 0 || c.desc < 0) throw new Error('No reconozco el formato. Debe ser el extracto CSV de Revolut (con columnas de fecha, descripción e importe).');
    const usesTotal = /total/.test(H[c.amount]);
    const expenses = [], incomes = [], balances = {};
    for (const r of rows.slice(1)) {
      const state = (r[c.state] ?? '').toUpperCase();
      if (/REVERT|DECLIN|FAIL|RECHAZ|CANCEL/.test(state)) continue;
      if (c.type >= 0 && /exchange|cambio/i.test(r[c.type] ?? '')) continue;
      let amount = parseAmount(r[c.amount]);
      if (isNaN(amount) || amount === 0) continue;
      const fee = c.fee >= 0 && !usesTotal ? Math.abs(parseAmount(r[c.fee]) || 0) : 0;
      if (amount < 0) amount -= fee;
      const date = parseCsvDate(c.date >= 0 ? r[c.date] : '') || parseCsvDate(c.date2 >= 0 ? r[c.date2] : '');
      if (!date) continue;
      const desc = (r[c.desc] ?? '').trim() || 'Movimiento';
      const currency = (r[c.currency] ?? 'EUR').trim().toUpperCase() || 'EUR';
      const ref = c.ref >= 0 ? (r[c.ref] ?? '').trim() : '';
      const external_id = 'csv:' + ((c.id >= 0 && r[c.id]?.trim()) || hashStr([date, desc, amount, c.balance >= 0 ? r[c.balance] : '', ref].join('|')));
      const status = /PEND/.test(state) ? 'pendiente' : 'pagado';
      if (c.balance >= 0 && r[c.balance]) { const b = parseAmount(r[c.balance]); if (!isNaN(b) && (!balances[currency] || date >= balances[currency].date)) balances[currency] = { date, balance: b }; }
      if (amount < 0) expenses.push({ external_id, date, concept: desc.slice(0, 140), purpose: null, amount: round2(Math.abs(amount)), currency, order_number: ref || null, category: guessCategory(desc + ' ' + ref), status, source: 'revolut' });
      else incomes.push({ external_id, date, concept: desc.slice(0, 140), amount: round2(amount), currency, is_youtube: /google|youtube|adsense/i.test(desc + ' ' + ref), source: 'revolut' });
    }
    return { expenses, incomes, balances };
  }

    const { expenses, incomes, balances } = parsed;

        <div class="card-inner p-3"><span class="text-[10px] muted block">De YouTube/Google</span><strong class="text-lg pos">${yt.length}</strong></div>
      </div>

      let newExp = 0, newInc = 0;
      for (let i = 0; i < expenses.length; i += 500) newExp += (must(await sb.from('expenses').upsert(expenses.slice(i, i + 500), { onConflict: 'external_id', ignoreDuplicates: true }).select('id')) ?? []).length;
      if (m.querySelector('#imp-incomes').checked) for (let i = 0; i < incomes.length; i += 500) newInc += (must(await sb.from('incomes').upsert(incomes.slice(i, i + 500), { onConflict: 'external_id', ignoreDuplicates: true }).select('id')) ?? []).length;
      const bal = Object.entries(balances).map(([cur, b]) => ({ provider: 'revolut', external_id: 'revolut-csv-' + cur, name: 'Revolut ' + cur, currency: cur, balance: b.balance, updated_at: new Date().toISOString() }));
      if (bal.length) must(await sb.from('bank_accounts').upsert(bal, { onConflict: 'external_id' }));
      await logNotification({ kind: 'banco', title: 'Extracto de Revolut importado', body: `${newExp} gastos y ${newInc} ingresos nuevos (${file.name})` });
      m.remove(); toast(`Importados ${newExp} gastos y ${newInc} ingresos nuevos`); renderView();
    });
  }

  // ---------- REVISIÓN NICHO IA (Gemini gratuito) ----------
  const PRIO = { alta: ['Alta', 'b-red'], media: ['Media', 'b-yellow'], baja: ['Baja', 'b-green'] };
  VIEWS.nicho = async (main, isCurrent) => {
    const [competitors, reports] = await Promise.all([
      sb.from('competitors').select('*').order('created_at').then(must),
      sb.from('ai_reports').select('*').order('created_at', { ascending: false }).limit(12).then(must),
    ]);
    if (!isCurrent()) return;
    const [latest, ...older] = reports ?? [];
    const pending = !(reports ?? []).some((r) => new Date(r.created_at) >= lastSunday20());
    const hasKey = !!AI.key();

    main.innerHTML = `
      ${pageHeader('Revisión Nicho IA', `Semanal: domingos a las 20:00 · Próxima: ${nextSunday20().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}`,
        '<button id="ai-run" class="btn btn-dark">✨ Analizar nicho ahora</button>')}

      ${pending && hasKey ? '<div class="card p-3 text-xs border !border-brand/60">⏳ La revisión de este domingo aún no se ha ejecutado: se lanzará automáticamente al abrir la app, o pulsa “Analizar nicho ahora”.</div>' : ''}

      <details class="card p-5" ${hasKey ? '' : 'open'}>
        <summary class="flex justify-between items-center"><span class="text-sm font-bold">⚙️ Configuración de la IA</span>
          <span class="badge ${hasKey ? 'b-green' : 'b-red'}">${hasKey ? 'API KEY GUARDADA' : 'FALTA API KEY'}</span></summary>
        <form id="ai-cfg" class="space-y-3 mt-4 text-xs">
          <div><label class="label req">API Key de Google Gemini (gratis)</label>
            <div class="flex gap-2"><input name="key" type="password" autocomplete="off" class="input flex-1 font-mono" placeholder="AIza…" value="${esc(AI.key())}">
              <button type="button" id="ai-key-show" class="icon-btn">Ver</button></div>
            <p class="text-[10px] subtle mt-1">Créala en <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" class="underline">aistudio.google.com/app/apikey</a>. Se guarda solo en este navegador.</p></div>
          <div class="grid sm:grid-cols-2 gap-3">
            <div><label class="label">Modelo</label><input name="model" class="input font-mono" value="${esc(AI.model())}"></div>
            <div><label class="label">API Key de YouTube Data (opcional, gratis)</label><input name="yt" type="password" autocomplete="off" class="input font-mono" placeholder="Para comparar con la competencia" value="${esc(AI.ytKey())}"></div>
          </div>
          <button class="btn btn-primary">Guardar configuración</button>
        </form>
      </details>

      <section class="card p-5 space-y-3">
        <div><h3 class="text-sm font-bold">Canales de la competencia</h3>
          <p class="text-xs muted">Canales de vuestro nicho con los que compararos (pega su ID “UC…” o su URL /channel/UC…).</p></div>
        <form id="ai-add" class="flex flex-wrap gap-2">
          <input name="input" required class="input flex-1 min-w-[14rem]" placeholder="URL o @handle del canal">
          <input name="niche" class="input !w-40" placeholder="Nicho (opcional)">
          <button class="btn btn-primary">Añadir</button>
        </form>
        <div class="flex flex-wrap gap-2">${(competitors ?? []).map((c) => `
          <span class="card-inner pl-1.5 pr-2 py-1 flex items-center gap-2 text-xs">
            ${c.thumbnail_url ? `<img src="${esc(c.thumbnail_url)}" class="w-6 h-6 rounded-full" alt="">` : ''}
            <a href="https://www.youtube.com/channel/${esc(c.youtube_channel_id)}" target="_blank" rel="noopener" class="font-semibold hover:underline">${esc(c.title)}</a>
            ${c.niche ? `<span class="subtle">· ${esc(c.niche)}</span>` : ''}
            <button data-del-comp="${c.id}" class="subtle hover:text-white" aria-label="Quitar">✕</button></span>`).join('') || '<p class="text-xs subtle">Aún no hay competidores. Añade 3-10 canales de vuestro nicho.</p>'}</div>
      </section>

      ${latest ? `<section class="card p-5 space-y-5"><div class="flex flex-wrap justify-between items-center gap-2"><h3 class="text-base font-bold">📋 Último informe</h3>
        <span class="text-[11px] muted">${fmtDateTime(latest.created_at)} · ${latest.source === 'cron' ? 'Automático (domingo)' : 'Manual · ' + esc(partnerName(latest.created_by))}</span></div>${reportBody(latest)}</section>`
        : '<div class="card p-8 text-center text-xs muted">Todavía no hay informes. Pulsa “Analizar nicho ahora”.</div>'}
      ${older.length ? `<section class="space-y-3"><h3 class="text-sm font-bold text-ink">Informes anteriores</h3>${older.map((r) => `
        <details class="card p-4" data-report="${r.id}"><summary class="flex justify-between items-center text-sm font-semibold"><span>Informe del ${fmtDateTime(r.created_at)}</span>
          <span class="badge b-gray">${r.source === 'cron' ? 'Automático' : 'Manual · ' + esc(partnerName(r.created_by))}</span></summary><div class="mt-4">${reportBody(r)}</div></details>`).join('')}</section>` : ''}`;

    if (latest) projectionChart($('#proj-' + latest.id), latest.data.projections);
    main.querySelectorAll('details[data-report]').forEach((d) => d.addEventListener('toggle', () => {
      const r = older.find((x) => x.id === d.dataset.report); const c = d.querySelector('canvas');
      if (d.open && r && c && !c.dataset.drawn) { projectionChart(c, r.data.projections); c.dataset.drawn = '1'; }
    }));
    const cfg = $('#ai-cfg');
    $('#ai-key-show').onclick = (e) => { cfg.key.type = cfg.key.type === 'password' ? 'text' : 'password'; e.target.textContent = cfg.key.type === 'password' ? 'Ver' : 'Ocultar'; };
    cfg.onsubmit = (e) => {
      e.preventDefault();
      LS.set('hub.gemini_key', cfg.key.value.trim()); LS.set('hub.gemini_model', cfg.model.value.trim() || 'gemini-2.5-flash'); LS.set('hub.yt_api_key', cfg.yt.value.trim());
      toast('Configuración guardada en este navegador'); renderView();
    };
    $('#ai-run').onclick = (e) => withBusy(e.currentTarget, '🤖 Analizando… (puede tardar 1 min)', async () => {
      await runNicheReview('manual'); toast('Informe generado'); renderView();
    });
    $('#ai-add').onsubmit = (e) => {
      e.preventDefault();
      withBusy(e.submitter, 'Buscando…', async () => {
        const input = e.target.input.value.trim();
        const id = /UC[\w-]{22}/.exec(input)?.[0];
        const handle = /@([\w.\-]+)/.exec(input)?.[1] ?? (!id && !input.includes('/') ? input.replace(/^@/, '') : null);
        let title = handle ? '@' + handle : id, thumb = null, ytId = id;
        if (AI.ytKey()) {
          const res = id ? await ytPublic('channels', { part: 'snippet', id }) : await ytPublic('channels', { part: 'snippet', forHandle: '@' + handle });
          const c = res.items?.[0];
          if (!c) throw new Error('No se ha encontrado el canal');
          ytId = c.id; title = c.snippet.title; thumb = c.snippet.thumbnails?.default?.url ?? null;
        } else if (!id) throw new Error('Sin API Key de YouTube solo puedo añadir canales por su ID (UC…). Añade la clave en “Configuración de la IA”.');
        must(await sb.from('competitors').upsert({ youtube_channel_id: ytId, title, thumbnail_url: thumb, niche: e.target.niche.value.trim() || null }, { onConflict: 'youtube_channel_id' }));
        toast('Añadido: ' + title); renderView();
      });
    };
    main.querySelectorAll('[data-del-comp]').forEach((b) => { b.onclick = async () => {
      if (!(await confirmDialog('¿Quitar este canal de la comparativa?', 'Quitar'))) return;
      must(await sb.from('competitors').delete().eq('id', b.dataset.delComp)); renderView();
    }; });
  };

  function reportBody(r) {
    const d = r.data ?? {}, p = d.projections ?? { scenarios: [], labels: [] };
    const rows = [
      ...(d.own ?? []).map((o) => ({ name: o.title, ours: true, subs: o.subscribers, avg: o.public?.avg_views_recent, freq: o.public?.uploads_per_week, shorts: o.public?.shorts_share, eng: o.public?.engagement })),
      ...(d.competitors ?? []).map((c) => ({ name: c.title, ours: false, subs: c.subscribers, avg: c.avg_views_recent, freq: c.uploads_per_week, shorts: c.shorts_share, eng: c.engagement })),
    ];
    const pct = (v) => v == null ? '—' : Math.round(v * 100) + ' %';
    const gap = (p.potential_monthly_revenue || 0) - (p.current_monthly_revenue || 0);
    return `
      ${r.summary ? `<p class="text-sm leading-relaxed">${esc(r.summary)}</p>` : ''}
      <div class="grid sm:grid-cols-3 gap-3">
        <div class="card-inner p-4"><span class="text-[11px] muted">Ingresos actuales (ritmo mensual)</span><span class="text-xl font-extrabold block mt-1">${fmtEur(p.current_monthly_revenue)}</span></div>
        <div class="card-inner p-4"><span class="text-[11px] muted">Proyección a 6 meses (base)</span><span class="text-xl font-extrabold block mt-1 pos">${fmtEur(p.scenarios?.find((s) => s.name === 'Base')?.revenue?.at(-1))}<span class="text-xs muted font-normal">/mes</span></span></div>
        <div class="card-inner p-4 border !border-brand/50"><span class="text-[11px] muted">Potencial si igualáis a la competencia</span><span class="text-xl font-extrabold block mt-1 text-brand">${p.potential_monthly_revenue ? fmtEur(p.potential_monthly_revenue) + '<span class="text-xs muted font-normal">/mes</span>' : '—'}</span>
          ${gap > 0 ? `<span class="text-[10px] subtle">+${fmtEur(gap)}/mes que podríais estar generando</span>` : ''}</div>
      </div>
      <div><h4 class="text-xs font-bold uppercase tracking-wider muted mb-2">Proyección de ingresos mensuales</h4>
        <div class="relative h-64"><canvas id="proj-${r.id}"></canvas></div><p class="text-[10px] subtle mt-2">${esc(p.assumptions || '')}</p></div>
      ${rows.length ? `<div><h4 class="text-xs font-bold uppercase tracking-wider muted mb-2">Comparativa (últimos 20 vídeos de cada canal)</h4>
        <div class="overflow-x-auto"><table class="table min-w-[600px]"><thead><tr><th>Canal</th><th class="text-right">Suscriptores</th><th class="text-right">Media vistas/vídeo</th><th class="text-right">Subidas/semana</th><th class="text-right">% Shorts</th><th class="text-right">Interacción</th></tr></thead>
        <tbody>${rows.map((x) => `<tr class="${x.ours ? 'bg-brand/10' : ''}"><td class="font-semibold">${x.ours ? '⭐ ' : ''}${esc(x.name)}</td><td class="text-right">${fmtNum(x.subs)}</td><td class="text-right">${x.avg != null ? fmtNum(x.avg) : '—'}</td><td class="text-right">${esc(x.freq ?? '—')}</td><td class="text-right">${pct(x.shorts)}</td><td class="text-right">${x.eng != null ? esc(x.eng) + ' %' : '—'}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
      ${(d.improvements ?? []).length ? `<div><h4 class="text-xs font-bold uppercase tracking-wider muted mb-2">Puntos de mejora</h4><ol class="space-y-2">${d.improvements.map((m, i) => {
        const pr = PRIO[m.prioridad] ?? PRIO.media;
        return `<li class="card-inner p-3"><div class="flex flex-wrap items-center gap-2 mb-1"><span class="text-brand font-extrabold text-sm">${i + 1}.</span><span class="badge ${pr[1]}">${pr[0]}</span>${m.area ? `<span class="badge b-gray">${esc(m.area)}</span>` : ''}<span class="text-[11px] muted">${esc(m.canal || '')}</span></div>
          <p class="text-sm font-semibold">${esc(m.accion)}</p>${m.motivo ? `<p class="text-xs muted mt-1">${esc(m.motivo)}</p>` : ''}</li>`; }).join('')}</ol></div>` : ''}
      ${(d.observations ?? []).length ? `<div><h4 class="text-xs font-bold uppercase tracking-wider muted mb-2">Qué hace bien la competencia</h4><ul class="list-disc pl-5 space-y-1 text-xs">${d.observations.map((o) => `<li>${esc(o)}</li>`).join('')}</ul></div>` : ''}
      ${(d.warnings ?? []).map((w) => `<p class="text-[11px] text-amber-200">⚠️ ${esc(w)}</p>`).join('')}
      ${d.ai_error ? `<p class="text-[11px] neg">Aviso IA: ${esc(d.ai_error)}</p>` : ''}`;
  }

  // ---------- CALENDARIO ----------
  const PRIORITY = { baja: ['Baja', 'b-green'], media: ['Media', 'b-yellow'], alta: ['Alta', 'b-orange'], urgente: ['Urgente', 'b-red'] };
  const RESP = { pendiente: ['⏳', 'Pendiente'], confirmado: ['✅', 'Confirmado'], rechazado: ['❌', 'No asiste'] };
  const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);

  VIEWS.calendario = async (main, isCurrent) => {
    S.calMonth ??= monthStart(new Date());
    const m = S.calMonth;
    const gridStart = new Date(m); gridStart.setDate(1 - ((m.getDay() + 6) % 7));
    const gridEnd = new Date(gridStart); gridEnd.setDate(gridStart.getDate() + 42);
    const upcomingEnd = new Date(Date.now() + 30 * 864e5);
    const from = new Date(Math.min(gridStart, Date.now() - 864e5)), to = new Date(Math.max(gridEnd, upcomingEnd));
    const events = must(await sb.from('events').select('*').gte('starts_at', from.toISOString()).lt('starts_at', to.toISOString()).order('starts_at')) ?? [];
    const responses = events.length ? must(await sb.from('event_responses').select('*').in('event_id', events.map((e) => e.id))) ?? [] : [];
    if (!isCurrent()) return;
    const byDay = {};
    for (const e of events) (byDay[localDay(new Date(e.starts_at))] ??= []).push(e);
    const today = localDay(), selected = S.calDay;
    const list = selected ? (byDay[selected] ?? []) : events.filter((e) => new Date(e.starts_at) >= new Date(Date.now() - 3600e3) && new Date(e.starts_at) < upcomingEnd);
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
      const key = localDay(d), evs = byDay[key] ?? [];
      cells.push(`<button data-day="${key}" class="cal-day ${d.getMonth() !== m.getMonth() ? 'other' : ''} ${key === today ? 'today' : ''} ${key === selected ? 'selected' : ''}">
        <span>${d.getDate()}</span><span class="flex flex-wrap gap-0.5 mt-1">${evs.slice(0, 4).map((e) => `<span class="dot p-${e.priority}"></span>`).join('')}</span></button>`);
    }
    const monthTitle = (() => { const t = m.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); })();
    const notifOk = 'Notification' in window && Notification.permission === 'granted';

    main.innerHTML = `
      ${pageHeader('Calendario', 'Reuniones y eventos importantes entre socios.', '<button id="cal-add" class="btn btn-dark">＋ Añadir reunión / Evento</button>')}
      ${!notifOk && 'Notification' in window ? `<div class="card p-3 flex flex-wrap items-center justify-between gap-2 text-xs"><span>🔔 Activa las notificaciones del navegador para recibir los avisos urgentes y los recordatorios.</span><button id="cal-notif" class="btn btn-primary btn-sm">Activar</button></div>` : ''}
      <div class="grid lg:grid-cols-5 gap-5">
        <section class="card p-4 lg:col-span-3">
          <div class="flex items-center justify-between mb-3"><button id="cal-prev" class="icon-btn" aria-label="Mes anterior">◀</button><h3 class="text-sm font-bold">${esc(monthTitle)}</h3><button id="cal-next" class="icon-btn" aria-label="Mes siguiente">▶</button></div>
          <div class="cal-grid mb-1">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((w) => `<div class="text-center text-[10px] font-bold subtle">${w}</div>`).join('')}</div>
          <div class="cal-grid">${cells.join('')}</div>
          <div class="flex flex-wrap gap-3 mt-3 text-[10px] muted">${Object.entries(PRIORITY).map(([k, [l]]) => `<span class="flex items-center gap-1"><span class="dot p-${k}"></span>${l}</span>`).join('')}</div>
        </section>
        <section class="lg:col-span-2 space-y-3">
          <div class="flex justify-between items-center"><h3 class="text-sm font-bold text-ink">${selected ? esc(new Date(selected + 'T00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })) : 'Próximos 30 días'}</h3>
            ${selected ? '<button id="cal-clear" class="text-xs text-ink underline">Ver próximos</button>' : ''}</div>
          ${list.length ? list.map((e) => eventCard(e, responses.filter((r) => r.event_id === e.id))).join('') : '<div class="card p-5 text-xs muted text-center">No hay eventos.</div>'}
        </section>
      </div>`;
    $('#cal-notif')?.addEventListener('click', (e) => withBusy(e.currentTarget, '…', async () => { await askNotificationPermission(); toast('Notificaciones activadas'); renderView(); }));
    $('#cal-prev').onclick = () => { S.calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); S.calDay = null; renderView(); };
    $('#cal-next').onclick = () => { S.calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); S.calDay = null; renderView(); };
    $('#cal-clear')?.addEventListener('click', () => { S.calDay = null; renderView(); });
    $('#cal-add').onclick = () => openEventModal(null, [], selected);
    main.querySelectorAll('[data-day]').forEach((b) => { b.onclick = () => { S.calDay = b.dataset.day === S.calDay ? null : b.dataset.day; renderView(); }; });
    main.querySelectorAll('[data-edit-ev]').forEach((b) => { b.onclick = () => { const ev = events.find((x) => x.id === b.dataset.editEv); openEventModal(ev, responses.filter((r) => r.event_id === ev.id)); }; });
    main.querySelectorAll('[data-rsvp]').forEach((b) => { b.onclick = async () => {
      const [id, status] = b.dataset.rsvp.split(':');
      const { error } = await sb.from('event_responses').upsert({ event_id: id, user_id: S.profile.id, status });
      if (error) return toast(error.message, 'error');
      toast(status === 'confirmado' ? 'Asistencia confirmada' : 'Has indicado que no asistes'); renderView();
    }; });
  };

  function eventCard(e, resps) {
    const start = new Date(e.starts_at), end = new Date(start.getTime() + e.duration_min * 60e3);
    const mine = resps.find((r) => r.user_id === S.profile.id);
    const isPart = (e.participants ?? []).includes(S.profile.id);
    return `<article class="card p-4 space-y-2.5 ${e.priority === 'urgente' ? 'ring-2 ring-rose-400/70' : ''}">
      <div class="flex justify-between items-start gap-2"><div class="min-w-0">
        <div class="flex items-center gap-2 mb-1"><span class="badge ${PRIORITY[e.priority][1]}">${PRIORITY[e.priority][0].toUpperCase()}</span>
          <span class="text-[11px] muted">${start.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' })} · ${fmtTime(start)}–${fmtTime(end)}</span></div>
        <h4 class="text-sm font-bold">${esc(e.title)}</h4></div>
        <button data-edit-ev="${e.id}" class="icon-btn shrink-0" title="Editar">✏️</button></div>
      ${e.description ? `<p class="text-xs muted whitespace-pre-wrap">${esc(e.description)}</p>` : ''}
      <div class="flex flex-wrap gap-2">${(e.participants ?? []).map((pid) => {
        const r = resps.find((x) => x.user_id === pid)?.status ?? 'pendiente';
        return `<span class="card-inner flex items-center gap-1.5 pl-1 pr-2 py-0.5 text-[11px]" title="${RESP[r][1]}">${avatar(partner(pid), 'w-5 h-5')}${esc(partnerName(pid))} ${RESP[r][0]}</span>`; }).join('')}</div>
      <div class="flex flex-wrap items-center gap-2 pt-1">
        ${e.meeting_url ? `<a href="${esc(e.meeting_url)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">🎥 Unirse a la videollamada</a>` : ''}
        ${isPart ? `<button data-rsvp="${e.id}:confirmado" class="btn btn-ghost btn-sm ${mine?.status === 'confirmado' ? '!bg-emerald-400/20' : ''}">Asistiré</button>
          <button data-rsvp="${e.id}:rechazado" class="btn btn-ghost btn-sm ${mine?.status === 'rechazado' ? '!bg-rose-400/20' : ''}">No asistiré</button>` : ''}
        ${e.reminder ? '<span class="text-[10px] subtle ml-auto">🔔 Aviso 30 min antes</span>' : ''}
      </div></article>`;
  }

  function dayOptions(selected) {
    const out = [], seen = new Set(), base = new Date(); base.setHours(0, 0, 0, 0);
    const label = (d) => d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    for (let i = 0; i < 180; i++) { const d = new Date(base); d.setDate(base.getDate() + i); const k = localDay(d); seen.add(k); out.push([k, label(d)]); }
    if (selected && !seen.has(selected)) out.unshift([selected, label(new Date(selected + 'T00:00'))]);
    return out.map(([k, l]) => `<option value="${k}" ${k === selected ? 'selected' : ''}>${l}</option>`).join('');
  }

  function openEventModal(ev, resps, presetDay = null) {
    const start = ev ? new Date(ev.starts_at) : null;
    const day = start ? localDay(start) : (presetDay && presetDay >= localDay() ? presetDay : localDay());
    const hh = start ? start.getHours() : 10, mm = start ? Math.round(start.getMinutes() / 15) * 15 % 60 : 0;
    const parts = ev?.participants ?? S.profiles.map((p) => p.id);
    const m = openModal(`
      ${modalHeader(ev ? 'Editar evento' : 'Añadir reunión / Evento')}
      <form id="ev-form" class="space-y-3 text-xs">
        <div><label class="label req">Título</label><input name="titulo" required maxlength="120" class="input" value="${esc(ev?.title || '')}" placeholder="Ej: Revisión mensual de canales"></div>
        <div><label class="label">Descripción</label><textarea name="description" rows="3" maxlength="2000" class="input" placeholder="Orden del día, enlaces…">${esc(ev?.description || '')}</textarea></div>
        <div><label class="label req">Día</label><select name="day" class="input">${dayOptions(day)}</select></div>
        <div class="grid grid-cols-3 gap-3">
          <div><label class="label req">Hora</label><select name="hh" class="input">${Array.from({ length: 24 }, (_, i) => `<option value="${i}" ${i === hh ? 'selected' : ''}>${String(i).padStart(2, '0')}</option>`).join('')}</select></div>
          <div><label class="label req">Minutos</label><select name="mm" class="input">${[0, 15, 30, 45].map((x) => `<option value="${x}" ${x === mm ? 'selected' : ''}>${String(x).padStart(2, '0')}</option>`).join('')}</select></div>
          <div><label class="label">Duración</label><select name="duration" class="input">${[15, 30, 45, 60, 90, 120, 180, 240].map((x) => `<option value="${x}" ${(ev?.duration_min ?? 60) === x ? 'selected' : ''}>${x < 60 ? x + ' min' : (x / 60) + ' h'}</option>`).join('')}</select></div>
        </div>
        <div><label class="label req">Prioridad</label><select name="priority" class="input">${Object.entries(PRIORITY).map(([k, [l]]) => `<option value="${k}" ${(ev?.priority ?? 'media') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <p id="urgent-warn" class="hidden mt-1.5 p-2 rounded-lg bg-rose-500/15 border border-rose-400/40 text-rose-200 text-[11px]">⚠️ Al guardar se enviará una notificación del navegador y un aviso destacado a los socios participantes, y quedará registrado.</p></div>
        <div><label class="label">Socios participantes</label><div class="flex flex-wrap gap-2">${S.profiles.map((p) => `
          <label class="card-inner flex items-center gap-2 px-3 py-2 cursor-pointer"><input type="checkbox" name="participants" value="${p.id}" ${parts.includes(p.id) ? 'checked' : ''}>${esc(p.name)}</label>`).join('')}</div></div>
        <div><label class="label">Enlace de videollamada (Meet / Zoom)</label><input name="meeting_url" type="url" class="input" value="${esc(ev?.meeting_url || '')}" placeholder="https://meet.google.com/…"></div>
        <label class="flex items-center gap-2"><input type="checkbox" name="reminder" ${ev?.reminder === false ? '' : 'checked'}> Recordatorio automático 30 minutos antes</label>
        ${ev ? `<div class="card-inner p-3"><p class="label">Estado de confirmación</p><div class="flex flex-wrap gap-3">${(ev.participants ?? []).map((pid) => { const r = resps.find((x) => x.user_id === pid)?.status ?? 'pendiente'; return `<span>${esc(partnerName(pid))}: ${RESP[r][0]} ${RESP[r][1]}</span>`; }).join('')}</div></div>` : ''}
        <div class="flex gap-2 pt-2">${ev ? '<button type="button" id="ev-del" class="btn btn-danger">Eliminar</button>' : ''}<button class="btn btn-primary flex-1 py-2.5">${ev ? 'Guardar cambios' : 'Crear evento'}</button></div>
      </form>`);
    const form = m.querySelector('#ev-form');
    const warn = () => m.querySelector('#urgent-warn').classList.toggle('hidden', form.priority.value !== 'urgente' || (ev?.urgent_notified && ev.priority === 'urgente'));
    form.priority.onchange = warn; warn();
    form.onsubmit = (e) => {
      e.preventDefault();
      withBusy(e.submitter, 'Guardando…', async () => {
        const startsAt = new Date(`${form.day.value}T${String(form.hh.value).padStart(2, '0')}:${String(form.mm.value).padStart(2, '0')}`);
        const participants = [...form.querySelectorAll('input[name=participants]:checked')].map((x) => x.value);
        if (!participants.length) throw new Error('Selecciona al menos un socio');
        const url = form.meeting_url.value.trim();
        if (url && !/^https:\/\//i.test(url)) throw new Error('El enlace debe empezar por https://');
        const row = { title: form.titulo.value.trim(), description: form.description.value.trim() || null, starts_at: startsAt.toISOString(), duration_min: Number(form.duration.value), priority: form.priority.value, participants, meeting_url: url || null, reminder: form.reminder.checked };
        if (ev && startsAt.getTime() !== new Date(ev.starts_at).getTime()) row.reminder_sent = false;
        const saved = must(ev ? await sb.from('events').update(row).eq('id', ev.id).select().single() : await sb.from('events').insert(row).select().single());
        await sb.from('event_responses').upsert(participants.map((pid) => ({ event_id: saved.id, user_id: pid, status: pid === S.profile.id && !ev ? 'confirmado' : 'pendiente' })), { onConflict: 'event_id,user_id', ignoreDuplicates: true });
        const removed = (ev?.participants ?? []).filter((p) => !participants.includes(p));
        if (removed.length) await sb.from('event_responses').delete().eq('event_id', saved.id).in('user_id', removed);

        // ---- REUNIÓN URGENTE: notificación del navegador + aviso en la web + registro ----
        if (saved.priority === 'urgente' && !saved.urgent_notified) {
          const body = `${startsAt.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' })} a las ${fmtTime(startsAt)}${saved.meeting_url ? ' · ' + saved.meeting_url : ''}`;
          await logNotification({ kind: 'evento_urgente', priority: 'urgente', title: 'Reunión urgente: ' + saved.title, body, event_id: saved.id, recipients: participants });
          await sb.from('events').update({ urgent_notified: true }).eq('id', saved.id);
          if (!('Notification' in window) || Notification.permission === 'default') { try { await askNotificationPermission(); } catch { /* */ } }
          const shown = browserNotify('🚨 Reunión urgente: ' + saved.title, body, 'urg-' + saved.id);
          toast(shown ? 'Urgente: notificación enviada y registrada' : 'Urgente: aviso registrado (activa las notificaciones del navegador)');
        } else toast(ev ? 'Evento actualizado' : 'Evento creado');

        S.calMonth = monthStart(startsAt); S.calDay = localDay(startsAt);
        m.remove(); renderView();
      });
    };
    m.querySelector('#ev-del')?.addEventListener('click', async () => {
      if (!(await confirmDialog(`¿Eliminar "${ev.title}"?`, 'Eliminar'))) return;
      const { error } = await sb.from('events').delete().eq('id', ev.id);

    });

    if (!isCurrent()) return;
    secrets = new Map();
    for (const a of accounts) {
      try { secrets.set(a.id, { password: await decrypt(S.vaultKey, a.password_enc), twofa: a.twofa_enc ? await decrypt(S.vaultKey, a.twofa_enc) : '' }); }

  function vaultUnlock(main, meta) {
    main.innerHTML = `${pageHeader('Cuentas y Correos', 'Gestor de credenciales cifrado de extremo a extremo.')}
      <section class="card p-6 max-w-md space-y-4"><div class="text-3xl">🔒</div><h3 class="text-base font-bold">Gestor bloqueado</h3>

        <form id="vu-form" class="space-y-3"><input name="pass" type="password" required autocomplete="current-password" class="input" placeholder="Clave maestra"><button class="btn btn-primary w-full py-2.5">Desbloquear</button></form></section>`;
    const input = $('#vu-form').pass; setTimeout(() => input.focus(), 50);
    $('#vu-form').onsubmit = (e) => {
      e.preventDefault();
      withBusy(e.submitter, 'Comprobando…', async () => {
        const key = await deriveKey(input.value, meta.salt, meta.iterations);
        try { if ((await decrypt(key, meta.verifier)) !== VERIFIER_TEXT) throw new Error(); } catch { input.value = ''; throw new Error('Clave maestra incorrecta'); }
        S.vaultKey = key; renderView();
      });
    };
  }

  async function uploadFiles(list, folderId) {
    if (!list.length) return;
    const box = $('#cl-progress'); box.classList.remove('hidden');
    let ok = 0;
    for (const [i, file] of list.entries()) {
      box.textContent = `Subiendo ${i + 1}/${list.length}: ${file.name}…`;
      if (file.size > MAX_FILE_MB * 1048576) { toast(`${file.name} supera ${MAX_FILE_MB} MB`, 'error'); continue; }
      const path = `cloud/${folderId ?? 'root'}/${uuid()}-${file.name.replace(/[^\w.\-]/g, '_')}`;
      const up = await sb.storage.from(STORAGE_BUCKET).upload(path, file, { contentType: file.type || 'application/octet-stream' });
      if (up.error) { toast(`${file.name}: ${up.error.message}`, 'error'); continue; }
      const { error } = await sb.from('files').insert({ folder_id: folderId, name: file.name, storage_path: path, size: file.size, mime: file.type || null });
      if (error) { await sb.storage.from(STORAGE_BUCKET).remove([path]); toast(error.message, 'error'); continue; }
      ok++;
    }
    toast(`${ok} archivo(s) subido(s)`); renderView();
  }
  function folderOptions(all, excludeId, selected) {
    const banned = new Set();
    if (excludeId) { const stack = [excludeId]; while (stack.length) { const id = stack.pop(); banned.add(id); all.filter((f) => f.parent_id === id).forEach((f) => stack.push(f.id)); } }
    const pathOf = (f) => { const p = []; for (let x = f; x; x = all.find((y) => y.id === x.parent_id)) p.unshift(x.name); return p.join(' / '); };
    return '<option value="">☁️ Inicio</option>' + all.filter((f) => !banned.has(f.id)).map((f) => [f.id, pathOf(f)]).sort((a, b) => a[1].localeCompare(b[1]))
      .map(([id, p]) => `<option value="${id}" ${id === selected ? 'selected' : ''}>📁 ${esc(p)}</option>`).join('');
  }

    form.onsubmit = (e) => { e.preventDefault(); withBusy(e.submitter, 'Guardando…', async () => {
      const row = { title: form.titulo.value.trim(), content: form.content.value, tags: form.tags.value.split(',').map((t) => t.trim().replace(/^#/, '')).filter(Boolean), folder_id: p ? (form.folder.value || null) : folderId };
      must(p ? await sb.from('prompts').update(row).eq('id', p.id) : await sb.from('prompts').insert(row));
      m.remove(); toast('Prompt guardado'); renderView();
    }); };
    m.querySelector('#pr-del')?.addEventListener('click', async () => {
      if (!(await confirmDialog(`¿Eliminar el prompt "${p.title}"?`, 'Eliminar'))) return;
      const { error } = await sb.from('prompts').delete().eq('id', p.id); if (error) return toast(error.message, 'error');
      m.remove(); toast('Prompt eliminado'); renderView();
    });
  }

  // ---------- AJUSTES ----------
  VIEWS.ajustes = async (main, isCurrent) => {
    const [me, factors] = await Promise.all([
      sb.from('profiles').select('phone').eq('id', S.profile.id).single().then(must),
      sb.auth.mfa.listFactors().then(({ data }) => data?.totp ?? []),
    ]);
    if (!isCurrent()) return;
    const notif = !('Notification' in window) ? 'unsupported' : Notification.permission;
    main.innerHTML = `
      ${pageHeader('Ajustes', 'Tu cuenta, seguridad y notificaciones.')}
      <section class="card p-5 space-y-3"><h3 class="text-sm font-bold">Mi cuenta</h3>
        <div class="grid sm:grid-cols-3 gap-3 text-xs">
          <div class="card-inner p-3"><span class="subtle block">Nombre</span><strong>${esc(S.profile.name)}</strong></div>
          <div class="card-inner p-3"><span class="subtle block">Rol</span><strong>${S.profile.role === 'admin' ? 'Admin' : 'Socio'}</strong></div>
          <div class="card-inner p-3"><span class="subtle block">Verificación en dos pasos</span><strong>${factors.filter((f) => f.status === 'verified').length ? '✅ Activa (TOTP)' : '—'}</strong></div>
        </div>
        <form id="st-phone" class="flex flex-wrap gap-2 items-end"><div class="flex-1 min-w-[12rem]"><label class="label">Móvil</label><input name="phone" type="tel" class="input" value="${esc(me?.phone || '')}"></div><button class="btn btn-primary">Guardar móvil</button></form>
      </section>
      <section class="card p-5 space-y-3"><h3 class="text-sm font-bold">Cambiar contraseña</h3>
        <form id="st-pass" class="grid sm:grid-cols-3 gap-3 items-end">
          <div><label class="label">Nueva contraseña</label><input name="p1" type="password" minlength="12" required autocomplete="new-password" class="input"></div>
          <div><label class="label">Repítela</label><input name="p2" type="password" minlength="12" required autocomplete="new-password" class="input"></div>
          <button class="btn btn-primary">Actualizar</button></form></section>
      <section class="card p-5 space-y-3"><h3 class="text-sm font-bold">Notificaciones del navegador</h3>
        ${notif === 'unsupported' ? '<p class="text-xs muted">Este navegador no admite notificaciones. Los avisos urgentes se mostrarán dentro de la web.</p>' : `
        <div class="flex flex-wrap items-center gap-3"><span class="badge ${notif === 'granted' ? 'b-green' : notif === 'denied' ? 'b-red' : 'b-gray'}">${notif === 'granted' ? 'ACTIVADAS' : notif === 'denied' ? 'BLOQUEADAS' : 'DESACTIVADAS'}</span>
          ${notif !== 'granted' ? '<button id="st-notif" class="btn btn-primary btn-sm">Activar</button>' : '<button id="st-test" class="btn btn-ghost btn-sm">Probar</button>'}</div>`}
        <p class="text-[11px] subtle">Llegan mientras la web está abierta (en una pestaña o como app instalada). Los avisos urgentes también aparecen destacados dentro de la web la próxima vez que entres.</p></section>
      ${isAdmin() ? `<section class="card p-5 space-y-2"><h3 class="text-sm font-bold">Administración</h3>
        <p class="text-xs muted">Si un socio pierde el móvil o la contraseña: en Supabase → <strong class="text-white">Authentication → Users</strong>, entra en su usuario, borra su factor MFA y envíale un enlace para restablecer la contraseña. Para obligarle a repetir el primer acceso, ejecuta en el SQL Editor:</p>
        <code class="card-inner block p-2 font-mono text-[11px] break-all">update profiles set must_change_password = true where slug = 'toni';</code></section>` : ''}`;
    $('#st-phone').onsubmit = (e) => { e.preventDefault(); withBusy(e.submitter, 'Guardando…', async () => { must(await sb.rpc('complete_first_access', { p_phone: e.target.phone.value })); toast('Móvil actualizado'); }); };
    $('#st-pass').onsubmit = (e) => {
      e.preventDefault();
      const { p1, p2 } = e.target;
      if (p1.value !== p2.value) return toast('Las contraseñas no coinciden', 'error');
      if (p1.value.length < 12 || !/[a-zA-Z]/.test(p1.value) || !/\d/.test(p1.value)) return toast('Mínimo 12 caracteres, con letras y números', 'error');
      withBusy(e.submitter, 'Guardando…', async () => {
        const { error } = await sb.auth.updateUser({ password: p1.value });
        if (error) throw new Error(traduceAuth(error.message));
        sb.rpc('log_password_change'); e.target.reset(); toast('Contraseña actualizada');
      });
    };
    $('#st-notif')?.addEventListener('click', (e) => withBusy(e.currentTarget, '…', async () => { await askNotificationPermission(); toast('Notificaciones activadas'); renderView(); }));
    $('#st-test')?.addEventListener('click', () => { if (!browserNotify('Prueba de notificación', 'Si ves esto, los avisos funcionan en este dispositivo.')) toast('Tu navegador no deja mostrar avisos desde esta página', 'error'); });
  };

  // ===================================================================
  // 11. ARRANQUE
  // ===================================================================
  async function boot() {
    if (!CONFIG_OK) return showLogin();
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return showLogin();
    try { await routeAuth(); }
    catch (e) { console.error(e); await sb.auth.signOut(); L.step = 'credentials'; showLogin('Sesión caducada, vuelve a entrar.'); }
  }
  sb?.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT' && S.profile) { S.profile = null; L.step = 'credentials'; showLogin(); }
  });
  boot();
  })();
  </script>
</body>
</html>
